slug: task-set-gap-2
title: The gap at the population window edge is fixed by exponential spread to the required coverage; the reservoir
  exponent approaches 1 as noise or ridge dominates interference
created: 2026-09-07
exploratory: false
theory:
  name: task-set-gap
  version: 2
  supersedes: task-set-gap@1
  statement: 'Version one''s structure stands: a positive gap from the propagation transition, scaling as one over
    the task''s depth for rate objectives. Version two replaces two derivations. (1) Population: spread among a
    finite set of units is logistic, not exponential with saturation. Counting agents, the edge gap satisfies Proposition
    8, gap x (T - t0) = ln(C_req N). Counting islands, the cross-island rate at the edge satisfies the logistic
    form of Theorem 6, gap x (T - t0) = ln((G - 1) C_req / (1 - C_req)), independent of N at fixed G; and at the
    edge, half coverage is reached at a fixed fraction of the available time, (T - t0)/(t_half - t0) = ln((G - 1)
    C_req/(1 - C_req)) / ln(G - 1). No free parameters. (2) Reservoir: interference among delays softens the exponent
    below 1; as input noise or ridge penalty dominates interference, the exponent rises toward 1.'
  formal: 'docs/FORMAL_STRUCTURE.md, Proposition 8, Section 10, and the two design-pilot corrections recorded there:
    the island-count form (agents versus islands) and the logistic coverage law. Design-pilot record on seed base
    5151: agent-count ratios in band in 12 to 14 of 16 cells with all estimates inside their intervals; the exponential-saturation
    island constant ln(C_req G) was off by a factor of about 2.5 in every cell and was replaced by the logistic
    constant, against which the pilot''s median ratio is about 1.1; reservoir exponent 0.98 at noise 0.15; ridge
    ordering held; the size effect (0.03) is unresolvable and is exploratory.'
  scope: 'Copy-or-climb population, K = 6. N sweep: G = 10, N in {50, 100, 200, 400}, T in {250, 500, 1000, 2000}.
    G sweep: N = 200, G in {5, 10, 20, 50}, T in {500, 1000}. m grid of 25 points from 2e-5 to 0.316; an edge at
    the grid floor is censored. Echo-state network with tanh units, density 0.1, delays k in {1, 2, 3, 4, 6, 8,
    16}; cells: noise 0.15 at n = 200 (R^2 floor 0.4); noise 0.01 at n = 200 and n = 800 (exploratory only); noise
    0.001 at n = 200 with ridge 1e-6, 1e-3, 1e-1 (floor 0.5).'
  prior_credence: 0.5
alternatives:
- id: H_struct
  statement: 'The edge gap is a property of the communication structure alone: no dependence on N at fixed G,

    and no relation to the coverage the window requires.

    '
- id: H_noform
  statement: 'Gaps are positive but Proposition 8''s prediction is off by more than a factor of two, or the

    reservoir exponent does not move toward 1 with noise, ridge, or size.

    '
- id: H_est
  statement: 'Version one''s failure was physics, not the estimator: a stable estimator still shows non-monotone

    gaps in T.

    '
predictions:
- id: P-B1
  statement: Counting agents, the measured edge gap equals Proposition 8's prediction ln(C_req N)/(T - t0) with
    no free parameter across the (N, T) cells.
  critical: true
  pass_if: among uncensored cells (at least 12 of 16, at most 2 censored), the ratio of measured to predicted agent
    gap lies in [0.65, 1.5] in all but at most 2, and none lies outside [0.4, 2.5]
  fail_if: 2 or more ratios lie outside [0.4, 2.5], or fewer than half lie in [0.65, 1.5]
  p_pass_if_true: 0.55
  p_pass_if_false: 0.05
  p_fail_if_true: 0.15
  p_fail_if_false: 0.65
  discriminates:
  - H_struct
  - H_noform
  outcome: inconclusive
  evidence: 'results/study_gap2/summary.md: 10/16 agent ratios in [0.65, 1.5]; 1 outside [0.4, 2.5] (N = 400, T
    = 2000, ratio 30.1, edge m = 0.0016 against neighbours near 0.0002; the plateau maximum is noisy there and the
    edge left it). The remaining 15 ratios run 0.77 to 1.90.'
- id: P-B2
  statement: Counting islands, the cross-island edge gap equals the logistic Theorem 6 prediction ln((G - 1) C_req/(1
    - C_req))/(T - t0) with no free parameter across the (N, T) cells, independent of N.
  critical: true
  pass_if: among uncensored cells (at least 12 of 16, at most 2 censored), the ratio of measured to predicted island
    gap lies in [0.6, 1.6] in all but at most 2, and none lies outside [0.4, 2.5]
  fail_if: 2 or more ratios lie outside [0.4, 2.5], or fewer than half lie in [0.6, 1.6]
  p_pass_if_true: 0.5
  p_pass_if_false: 0.05
  p_fail_if_true: 0.2
  p_fail_if_false: 0.65
  discriminates:
  - H_struct
  outcome: inconclusive
  evidence: 14/16 island ratios in [0.6, 1.6]; 1 outside (the same cell, ratio 27.8). The remaining 15 run 0.77
    to 1.94 with 14 in band; island gap x (T - t0) is 3.6 to 8.7 against the logistic constant 4.8.
- id: P-B3
  statement: With a smoothed edge estimator, the gap decreases in T at every N, and the exponent stays in the version-one
    band.
  critical: false
  pass_if: at every N, the T = 2000 interval lies entirely below the T = 250 point estimate and the T = 250 interval
    entirely above the T = 2000 point estimate, and the exponent of agent gap against T lies in [0.7, 1.3]
  fail_if: at any N the point estimates are not mutually excluded in that sense, or any exponent lies below 0.4
    or above 1.6
  p_pass_if_true: 0.6
  p_pass_if_false: 0.2
  p_fail_if_true: 0.15
  p_fail_if_false: 0.5
  discriminates:
  - H_est
  outcome: fail
  evidence: 'exponents by N: 0.95, 1.30, 1.07, -0.33; the N = 400 exponent and the mutual-exclusion test are broken
    by the same cell.'
- id: P-B4
  statement: At fixed N = 200 and across G in {5, 10, 20, 50}, half coverage at the edge is reached at the predicted
    fraction of the available time, (T - t0)/(t_half - t0) = ln((G - 1) C_req/(1 - C_req)) / ln(G - 1).
  critical: false
  pass_if: among uncensored (G, T) cells (at least 6 of 8), the ratio of measured to predicted time ratio lies in
    [0.7, 1.4] in all but at most 2, and none lies outside [0.5, 2.0]
  fail_if: 2 or more ratios lie outside [0.5, 2.0], or fewer than half lie in [0.7, 1.4]
  p_pass_if_true: 0.5
  p_pass_if_false: 0.1
  p_fail_if_true: 0.2
  p_fail_if_false: 0.55
  discriminates:
  - H_struct
  outcome: pass
  evidence: 8/8 timing ratios in [0.7, 1.4] (0.93 to 1.19) across G = 5, 10, 20, 50 at T = 500 and 1000; measured
    (T - t0)/(t_half - t0) runs 1.62 to 2.87 against predicted 1.75 to 2.54.
- id: P-C1
  statement: At input noise 0.15, where noise dominates interference, the reservoir exponent is close to 1.
  critical: true
  pass_if: at least 3 feasible delays (max R^2 >= 0.4) and the exponent lies in [0.85, 1.05]
  fail_if: at least 3 feasible delays and the 90% interval lies entirely below 0.7 or entirely above 1.2
  p_pass_if_true: 0.55
  p_pass_if_false: 0.1
  p_fail_if_true: 0.15
  p_fail_if_false: 0.6
  discriminates:
  - H_noform
  outcome: inconclusive
  evidence: alpha = 0.82 with interval [0.74, 0.89] over 5 feasible delays at noise 0.15; below the pass band [0.85,
    1.05]; the fail clause (interval below 0.7) is not met. The pilot on other seeds gave 0.98.
- id: P-C3
  statement: At noise 0.001, the ridge penalty acts as effective noise; the exponent rises with it.
  critical: false
  pass_if: alpha increases strictly across ridge 1e-6, 1e-3, 1e-1
  fail_if: alpha decreases strictly across ridge 1e-6, 1e-3, 1e-1
  p_pass_if_true: 0.5
  p_pass_if_false: 0.15
  p_fail_if_true: 0.15
  p_fail_if_false: 0.35
  discriminates:
  - H_noform
  outcome: pass
  evidence: 'alpha by ridge at noise 0.001: 0.49, 0.51, 0.72, strictly increasing, replicating the pilot.'
analysis_plan: 'One command: uv run python scripts/study_gap2.py (seed base 6161; pilots used 5151). Population:
  8 landscapes x 4 seeds per grid point; m grid of 25 log-spaced points from 2e-5 to 0.316. Curve smoothing: 3-point
  moving average in log m; edge = smallest m at which the smoothed mean fitness is within 0.005 of its maximum,
  log-linearly interpolated; an edge at the first grid point is censored and excluded. Agent gap: holders-growth
  factor at the bracketing grid points, log-linearly weighted, minus 1; island gap: the same on the count of islands
  holding the eventual best; t0: first-appearance time. Predictions: agents ln(C_req N)/(T - t0); islands ln((G
  - 1) C_req/(1 - C_req))/(T - t0); timing (T - t0)/(t_half - t0) = ln((G - 1) C_req/(1 - C_req))/ln(G - 1), with
  C_req = 1 - 0.005/(plateau - mean fitness at m = 0) capped at 0.995 and t_half the first time at least half the
  islands hold the best. Intervals: 200 bootstrap resamples over landscapes; estimates outside their own interval
  are flagged. Reservoir: 8 seeds per cell, 31 radii from 0.5 to 1.25, delays {1, 2, 3, 4, 6, 8, 16}, R^2 floor
  0.5 (0.4 for the noise-0.15 cell), exponent by least squares of log gap on log k over feasible delays, intervals
  from 200 resamples over seeds. Outcomes computed by the script under ''Outcomes, applied literally''. Runtime
  about 50 minutes on 10 cores.'
kill_rule: If P-B1 or P-B2 fails, the exponential-spread and logistic-spread accounts of the population edge are
  abandoned and the population half of the theory goes to the graveyard; a successor must derive the edge from a
  different mechanism and predict something these data do not show. If P-C1 fails, the claim that the reservoir
  exponent approaches 1 in the noise-dominated limit is abandoned.
results:
  summary: 'Population: every gap positive; the logistic island constant is within a factor 1.6 of its zero-parameter
    prediction in 14 of 15 clean cells and the agent-count prediction in 10 of 15; one cell (N = 400, T = 2000)
    failed by a factor of 30 because the plateau maximum is noisy there and the edge estimator followed it. The
    timing prediction across G, with no free parameter, passed 8 of 8 cells within 20 percent. Reservoir: noise-0.15
    exponent 0.82 [0.74, 0.89], short of the 0.85 band; ridge ordering replicated; the size effect, exploratory,
    is +0.05 with interval [+0.006, +0.10].'
  exploratory:
  - finding: 'The edge estimator fails when the plateau maximum is a noisy grid point: at N = 400, T = 2000 the
      smoothed maximum was inflated and the 0.005 window moved to a larger m. Bootstrap intervals are also very
      wide in several cells for the same reason.'
    next_test: Define the plateau as the median of the upper half of the smoothed curve rather than its maximum,
      and re-check on the saved pilot data before a version three.
  - finding: The size effect in the reservoir (n = 800 minus n = 200 at noise 0.01) is +0.049 with an interval excluding
      0 on these seeds.
    next_test: Preregister it again with n = 1600 added.
  - finding: The noise-dominated reservoir exponent moved from 0.98 (pilot seeds) to 0.82 (confirmatory seeds) with
      5 feasible delays; the estimate is seed-sensitive at this noise.
    next_test: More seeds and delays 1 to 6 in unit steps at noise 0.15 before restating the band.
review:
  strongest_objection: 'For the population: the same estimator defect that refuted version one, an edge that follows
    a noisy plateau maximum, survived into version two in one cell and by the frozen rules turns two 14-of-16 results
    into inconclusives; the estimator, not the logistic law, is what failed, but a rule is a rule. Against the theory:
    the island constant went through three forms at the design stage, and although the confirmatory seeds were fresh,
    a reader is entitled to discount a constant that was chosen after two misses. The timing prediction is the cleanest
    evidence in the study because it uses no growth fit at all. For the reservoir: 0.82 is not close to 1, and the
    pilot''s 0.98 was the optimistic tail of a seed-sensitive estimate.'
  confounds_checked:
  - bootstrap over 8 landscapes for every population interval; 8 seeds for every reservoir interval
  - 'censoring at the grid floor: no cell censored'
  - 'the failing cell inspected: edge at 0.0016 with neighbours at 0.0002, plateau maximum inflated'
  - reservoir feasibility floors applied as frozen
  what_would_change_my_mind: A version three with a median-plateau estimator that still leaves an island ratio outside
    [0.4, 2.5] in any cell, or a timing ratio outside [0.7, 1.4] in more than two cells. For the reservoir, an exponent
    interval at noise 0.15 that excludes 0.85 with 8 or more delays.
