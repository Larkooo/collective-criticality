analysis_plan: |
  One command: uv run python scripts/study_gap2.py (seed base 6161; the design pilot used 5151 and
  version one used 4242 and 7777). Population: 6 landscapes x 4 seeds per grid point. Curve smoothing:
  3-point moving average in log m before the edge is located; edge = smallest m at which the smoothed
  mean fitness is within 0.005 of its maximum, refined by log-linear interpolation. Measured gap:
  holders-growth factor at the bracketing grid points, log-linearly weighted, minus 1. t0: first
  appearance time of the eventual best, same weighting. Predicted gap: ln(C_req N)/(T - t0) with
  C_req = 1 - 0.005/(plateau - mean fitness at m = 0), plateau = maximum of the smoothed curve.
  Intervals: 200 bootstrap resamples over landscapes; an estimate outside its own interval is flagged
  and reported. Reservoir: 8 seeds per cell, 31 radii from 0.5 to 1.25, R^2 floor 0.5, exponent from
  least squares of log gap on log k over feasible delays, intervals from 200 resamples over seeds.
  Outcomes are computed by the script and printed under "Outcomes, applied literally". Runtime about
  40 minutes on 10 cores.

kill_rule: |
  If P-B1 or P-B2 fails, Proposition 8 is abandoned as a description of the population edge and the
  population half of the theory goes to the graveyard; a successor must derive the edge from a
  different mechanism and predict something these data do not show. If P-C1 fails, the claim that
  the reservoir exponent approaches 1 in the noise-dominated limit is abandoned.

