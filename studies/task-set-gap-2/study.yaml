slug: task-set-gap-2
title: The gap at the population window edge is fixed by exponential spread to the required coverage; the reservoir
  exponent approaches 1 as noise or ridge dominates interference
created: 2026-09-07
exploratory: false
theory:
  name: task-set-gap
  version: 2
  supersedes: task-set-gap@1
  statement: 'Version one''s structure stands: a positive gap from the propagation transition, scaling as one over
    the task''s depth for rate objectives. Version two replaces two derivations. (1) Population: spread among a
    finite set of units is logistic, not exponential with saturation. Counting agents, the edge gap satisfies Proposition
    8, gap x (T - t0) = ln(C_req N). Counting islands, the cross-island rate at the edge satisfies the logistic
    form of Theorem 6, gap x (T - t0) = ln((G - 1) C_req / (1 - C_req)), independent of N at fixed G; and at the
    edge, half coverage is reached at a fixed fraction of the available time, (T - t0)/(t_half - t0) = ln((G - 1)
    C_req/(1 - C_req)) / ln(G - 1). No free parameters. (2) Reservoir: interference among delays softens the exponent
    below 1; as input noise or ridge penalty dominates interference, the exponent rises toward 1.'
  formal: 'docs/FORMAL_STRUCTURE.md, Proposition 8, Section 10, and the two design-pilot corrections recorded there:
    the island-count form (agents versus islands) and the logistic coverage law. Design-pilot record on seed base
    5151: agent-count ratios in band in 12 to 14 of 16 cells with all estimates inside their intervals; the exponential-saturation
    island constant ln(C_req G) was off by a factor of about 2.5 in every cell and was replaced by the logistic
    constant, against which the pilot''s median ratio is about 1.1; reservoir exponent 0.98 at noise 0.15; ridge
    ordering held; the size effect (0.03) is unresolvable and is exploratory.'
  scope: 'Copy-or-climb population, K = 6. N sweep: G = 10, N in {50, 100, 200, 400}, T in {250, 500, 1000, 2000}.
    G sweep: N = 200, G in {5, 10, 20, 50}, T in {500, 1000}. m grid of 25 points from 2e-5 to 0.316; an edge at
    the grid floor is censored. Echo-state network with tanh units, density 0.1, delays k in {1, 2, 3, 4, 6, 8,
    16}; cells: noise 0.15 at n = 200 (R^2 floor 0.4); noise 0.01 at n = 200 and n = 800 (exploratory only); noise
    0.001 at n = 200 with ridge 1e-6, 1e-3, 1e-1 (floor 0.5).'
  prior_credence: 0.5
alternatives:
- id: H_struct
  statement: 'The edge gap is a property of the communication structure alone: no dependence on N at fixed G,

    and no relation to the coverage the window requires.

    '
- id: H_noform
  statement: 'Gaps are positive but Proposition 8''s prediction is off by more than a factor of two, or the

    reservoir exponent does not move toward 1 with noise, ridge, or size.

    '
- id: H_est
  statement: 'Version one''s failure was physics, not the estimator: a stable estimator still shows non-monotone

    gaps in T.

    '
