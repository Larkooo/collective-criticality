slug: task-set-gap-2
title: The gap at the population window edge is fixed by exponential spread to the required coverage; the reservoir exponent approaches 1 as noise or ridge dominates interference
created: 2026-09-07
exploratory: false

theory:
  name: task-set-gap
  version: 2
  supersedes: task-set-gap@1
  statement: |
    Version one's structure stands: a positive gap from the propagation transition, scaling as one over
    the task's depth for rate objectives. Version two replaces two derivations that version one got
    wrong or incomplete. (1) In the island population, the measured quantity is the growth of agents
    holding the eventual best, so the edge gap is fixed by exponential spread from first appearance to
    the coverage the window tolerance requires: gap x (T - t0) = ln(C_req N), with no free parameter,
    rising by ln 2 per doubling of N and independent of the number of islands at fixed N. (2) In the
    reservoir, interference among delays sharing a finite state softens the exponent below 1; as input
    noise, ridge penalty, or network size increase, the exponent rises toward 1.
  formal: |
    docs/FORMAL_STRUCTURE.md, Proposition 8 and Section 10. Entailed by the setup and reported, not
    counted: that gaps are positive (already shown in version one). Assumed and tested: that holders
    grow geometrically from first appearance to the required coverage (P-B1, P-B2), that the smoothed
    edge estimator is stable (P-B3), and that ridge acts as effective noise in the reservoir (P-C3).
  scope: |
    Copy-or-climb population, K = 6, G = 10 islands, N in {50, 100, 200, 400}, horizons T in
    {250, 500, 1000, 2000}, m grid of 25 points from 1e-4 to 0.316. Echo-state network with tanh units,
    density 0.1, delays k in {1, 2, 4, 8, 16}, cells: noise 0.3 and 1.0 at n = 200; noise 0.01 at
    n = 200 and n = 800; noise 0.001 at n = 200 with ridge 1e-6, 1e-3, 1e-1.
  prior_credence: 0.5

alternatives:
  - id: H_struct
    statement: |
      The edge gap is a property of the communication structure alone: no dependence on N at fixed G,
      and no relation to the coverage the window requires.
  - id: H_noform
    statement: |
      Gaps are positive but Proposition 8's prediction is off by more than a factor of two, or the
      reservoir exponent does not move toward 1 with noise, ridge, or size.
  - id: H_est
    statement: |
      Version one's failure was physics, not the estimator: a stable estimator still shows non-monotone
      gaps in T.

predictions:
  - id: P-B1
    statement: The measured edge gap equals Proposition 8's prediction ln(C_req N)/(T - t0) with no free parameter, across all 16 (N, T) cells.
    critical: true
    pass_if: the ratio of measured to predicted gap lies in [0.65, 1.5] in at least 14 of the 16 cells, and no ratio lies outside [0.4, 2.5]
    fail_if: 2 or more ratios lie outside [0.4, 2.5], or fewer than 8 of 16 lie in [0.65, 1.5]
    p_pass_if_true: 0.55
    p_pass_if_false: 0.05
    p_fail_if_true: 0.15
    p_fail_if_false: 0.65
    discriminates: [H_struct, H_noform]
    outcome: null
    evidence: null
  - id: P-B2
    statement: gap x (T - t0) rises with ln N with unit slope.
    critical: true
    pass_if: the least-squares slope of gap x (T - t0) against ln N, pooled over T, lies in [0.6, 1.4]
    fail_if: the 90% bootstrap interval of the slope lies entirely below 0.3 or entirely above 1.7
    p_pass_if_true: 0.6
    p_pass_if_false: 0.1
    p_fail_if_true: 0.15
    p_fail_if_false: 0.6
    discriminates: [H_struct]
    outcome: null
    evidence: null
  - id: P-B3
    statement: With a smoothed edge estimator, the gap decreases in T at every N, and the exponent stays in the version-one band.
    critical: false
    pass_if: at every N, the 90% interval at T = 2000 lies entirely below the interval at T = 250, and the exponent of gap against T lies in [0.7, 1.3]
    fail_if: at any N the intervals are not ordered, or any exponent lies below 0.4 or above 1.6
    p_pass_if_true: 0.6
    p_pass_if_false: 0.2
    p_fail_if_true: 0.15
    p_fail_if_false: 0.5
    discriminates: [H_est]
    outcome: null
    evidence: null
  - id: P-C1
    statement: At input noise 0.3, where noise dominates interference, the reservoir exponent is close to 1.
    critical: true
    pass_if: at least 3 feasible delays (max R^2 >= 0.5) and the exponent lies in [0.85, 1.05]
    fail_if: at least 3 feasible delays and the 90% interval lies entirely below 0.7 or entirely above 1.2
    p_pass_if_true: 0.55
    p_pass_if_false: 0.1
    p_fail_if_true: 0.15
    p_fail_if_false: 0.6
    discriminates: [H_noform]
    outcome: null
    evidence: null
  - id: P-C2
    statement: At noise 0.01, quadrupling the network from 200 to 800 units raises the exponent.
    critical: false
    pass_if: alpha(800) - alpha(200) is at least 0.05 and its 90% bootstrap interval lies entirely above 0
    fail_if: the interval lies entirely below 0
    p_pass_if_true: 0.55
    p_pass_if_false: 0.2
    p_fail_if_true: 0.15
    p_fail_if_false: 0.4
    discriminates: [H_noform]
    outcome: null
    evidence: null
  - id: P-C3
    statement: At noise 0.001, the ridge penalty acts as effective noise; the exponent rises with it.
    critical: false
    pass_if: alpha increases strictly across ridge 1e-6, 1e-3, 1e-1
    fail_if: alpha decreases strictly across ridge 1e-6, 1e-3, 1e-1
    p_pass_if_true: 0.5
    p_pass_if_false: 0.15
    p_fail_if_true: 0.15
    p_fail_if_false: 0.35
    discriminates: [H_noform]
    outcome: null
